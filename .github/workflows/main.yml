name: Android CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时自动构建并发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以读取 tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不使用 android-actions/setup-android：它会去安装已被下架的 'tools' 包，
      # 在 ubuntu-latest 上直接失败（主仓库踩过这个坑）。
      # ubuntu-latest 镜像本身自带 Android SDK，且 license 已接受。
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          echo "--- licenses ---"; ls "$SDK/licenses" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 先打印环境信息：失败时这段能区分「Gradle 没下来 / JDK 不对 / SDK 找不到」
      - name: Build environment info
        run: |
          echo "=== java ==="; java -version 2>&1 | head -3
          echo "=== gradle wrapper ==="; ./gradlew --version 2>&1 | head -12
          echo "=== secrets 是否存在（只看长度，不打印内容） ==="
          for k in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            v="${!k}"
            echo "  $k: ${#v} 字符"
          done
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifacts
        run: |
          VERSION=${GITHUB_REF_NAME}
          if [[ $GITHUB_REF != refs/tags/* ]]; then
            VERSION="nightly-$(git rev-parse --short HEAD)"
          fi

          OUTPUT_NAME="AirDeck-Mobile-${VERSION}-release.apk"

          mkdir -p final_artifacts
          # 先看构建到底签没签 —— 产物名带 -unsigned 后缀就说明 secret 没生效
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            SIGNED="no"
          else
            SIGNED="yes"
          fi
          echo "SIGNED=${SIGNED}" >> $GITHUB_ENV

          ls -l app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk "final_artifacts/${OUTPUT_NAME}"

          echo "FINAL_FILENAME=${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 诊断：把四个 secret 的状态算出来，写进 Release 说明里。
      # 这样不用登录就能从 GitHub API 读到，便于排查「secret 没生效」。
      - name: Collect signing diagnostics
        run: |
          # 写成文件当资产上传 —— Release body 对已存在的 Release 不会更新，
          # 只有资产是每次构建都覆盖的，所以诊断信息走这里。
          mkdir -p final_artifacts
          {
            echo "构建时间: $(date -u +%FT%TZ)"
            echo "commit:   $(git rev-parse HEAD)"
            echo
            echo "APK 是否已签名: ${SIGNED}"
            echo
            echo "接收到的 secret 长度（只打长度，不打内容）:"
            echo "  KEYSTORE_BASE64   (来自 KEYSTORE_FILE): ${#KEYSTORE_BASE64}"
            echo "  KEYSTORE_PASSWORD: ${#KEYSTORE_PASSWORD}"
            echo "  KEY_ALIAS        : ${#KEY_ALIAS}   值=${KEY_ALIAS:-(空)}"
            echo "  KEY_PASSWORD     : ${#KEY_PASSWORD}"
            echo
            echo "=== keystore base64 自检 ==="
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "  KEYSTORE_BASE64 是空的 —— secret 没读到"
            else
              # 只打印头尾各 8 个字符，够判断格式，不泄露密钥本体
              echo "  开头: ${KEYSTORE_BASE64:0:8}"
              echo "  结尾: ${KEYSTORE_BASE64: -8}"
              echo "  换行数: $(printf '%s' "$KEYSTORE_BASE64" | tr -cd '\n' | wc -c)"
              # 非 base64 字符（- 和 _ 说明是 URL-safe 变体，Basic 解码器会拒绝）
              echo "  非标准字符: $(printf '%s' "$KEYSTORE_BASE64" | tr -d 'A-Za-z0-9+/=\n\r' | head -c 40)"
              if printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/ks.jks 2>/tmp/b64err; then
                echo "  base64 -d: 成功，$(stat -c%s /tmp/ks.jks) 字节"
                echo "  文件类型: $(file -b /tmp/ks.jks)"
              else
                echo "  base64 -d: 失败 -> $(cat /tmp/b64err)"
              fi
            fi
            echo
            echo "构建产物:"
            ls -l app/build/outputs/apk/release/ 2>/dev/null || echo "  (目录不存在)"
          } > final_artifacts/signing-diagnostics.txt
          cat final_artifacts/signing-diagnostics.txt
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AirDeck Mobile ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🚀 AirDeck Mobile ${{ env.VERSION }}

            随身 WiFi / 定制网关的 Android 管理客户端。配合 [AirDeck](https://github.com/leehe-byte/AirDeck)
            服务端使用，也可以单独连原厂管理页。

            **这一版是什么**

            - 内置本地安全隧道：把远程网关服务映射到手机本机 `127.0.0.1`，
              WebView 因此被认定为「安全来源」，自动解锁 **WebCodecs / Scrcpy 投屏**
              （否则在非安全 HTTP 环境下会黑屏、无法调用硬件解码）
            - 启动后自动与网关握手，登录凭证同步注入所有隧道端口，不用反复输密码
            - 支持在 **AirDeck 定制界面** 与 **官方管理界面** 之间切换，隧道自动跟随端口
            - 可改网关 IP、自定义端口映射、管理密码；支持双击返回与一键退出
            - 电源监控通知：定时检测设备电量，低电量与满电提醒

            **⚠️ 从 2.3 及更早版本升级**

            这一版换了 `applicationId`（原来的 `com.opengw.manager` 和服务端撞了，
            两个 App 装在同一台设备上会互相顶掉）。
            所以**无法覆盖安装**，需要先卸载旧版再装这个。
            本 App 是无状态客户端，重装不影响网关上的任何配置。

            **本次构建的签名诊断**（排查完就删掉这段）

            | 项 | 值 |
            |---|---|
            | APK 已签名 | `${{ env.DIAG_SIGNED }}` |
            | `KEYSTORE_FILE` 长度 | `${{ env.DIAG_KEYSTORE_LEN }}` |
            | `KEYSTORE_PASSWORD` 长度 | `${{ env.DIAG_PWD_LEN }}` |
            | `KEY_ALIAS` | `${{ env.DIAG_ALIAS }}` |
            | `KEY_ALIAS` 长度 | `${{ env.DIAG_ALIAS_LEN }}` |
            | `KEY_PASSWORD` 长度 | `${{ env.DIAG_KEYPWD_LEN }}` |

            正常应该是：已签名 `yes`，`KEYSTORE_FILE` 长度 **3000~5000**（base64），
            `KEY_ALIAS` 是 `LeeHe-gif`。

            ---

            自动编译结果包含：
            - `${{ env.FINAL_FILENAME }}`
          files: final_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_FILENAME }}
          path: final_artifacts/*.apk
          retention-days: 7
